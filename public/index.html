<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d10" />

    <!-- Primary SEO -->
    <title>Dog Marketplace — Premium Dog Supplies & Dogs for Adoption</title>
    <meta
      name="description"
      content="Shop premium dog supplies and adopt loving dogs. Same-day delivery, free shipping, and quality you can trust. Dog Marketplace."
    />

      name="keywords"
      content="dog supplies, dog toys, dog beds, dog food, dogs for adoption, dog marketplace, pet supplies"

    <!-- Google Search Console verification (keep your existing value) -->

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn previews) -->

    <meta property="og:site_name" content="Dog Marketplace" />
    <meta
      property="og:title"
      content="Dog Marketplace — Premium Dog Supplies & Dogs for Adoption"
    />
    <meta
      property="og:description"
      content="Shop premium dog supplies and adopt loving dogs. Same-day delivery, free shipping."
    />
    <meta property="og:url" content="https://www.dogmarketplace.online/" />
    <meta
      property="og:image"
      content="https://www.dogmarketplace.online/logo.png"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dog Marketplace" />
    <meta
      name="twitter:description"
      content="Premium dog supplies and dogs for adoption — same-day delivery."
    />

      name="twitter:image"
      content="https://www.dogmarketplace.online/logo.png"
    />
